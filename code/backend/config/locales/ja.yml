# この API 独自の日本語の文言。Rails の標準メッセージ（「を入力してください」など）は rails-i18n が持っている。
# 詳しくは design/designs/API設計.md の 16-1-10、権限_バリデーション.md の 17-3-6
ja:
  api:
    errors:
      # エラーの返事の message（画面の上部に出す一言）
      unauthorized: ログインしてください
      # ログインの窓口で、メールアドレスかパスワードが違うとき（権限_バリデーション.md の 17-3-1）
      login_failed: ログインができません
      forbidden: この操作はできません
      # ログインの回数制限を超えたとき（429）
      too_many_requests: しばらくしてからお試しください
      not_found: 見つかりません
      unprocessable: 入力内容を確認してください
      # 今の状態ではできない操作（409。権限_バリデーション.md の 17-3-6）
      conflict: この操作は今はできません。画面を読み込み直してください
      internal_server_error: エラーが起きました

  # 項目名。エラーの文が「メールアドレスを入力してください」のように、項目名付きになる
  activerecord:
    attributes:
      user:
        email: メールアドレス
        password: パスワード
        password_confirmation: パスワード（確認）
        role: 種別
      company_profile:
        name: 会社名
        business_description: 事業内容
        about: どんな会社か
        employee_size: 人数
        industry_ids: 業界
        business_type_ids: 事業形態
        icon: アイコン
      student_profile:
        name: 氏名
        university_id: 大学
        university_other_name: 大学名
        faculty_id: 学部
        department_id: 学科
        grade: 学年
        prefecture_id: 在住の都道府県
        self_pr_strength: 自己PR（強み・向いていること）
        self_pr_weakness: 自己PR（向いていないこと）
        self_pr_future: 自己PR（この先やりたいこと）
        graduation_year: 卒業年度
        activity_status: 活動状況
        work_days_per_week: 週の稼働日数
        work_hours_per_day: 1日の稼働時間
        duration_months: 継続期間
        available_from: 開始時期
        can_full_remote: フルリモート
        can_partial_remote: 一部リモート
        can_onsite: 出社
        work_note: 稼働条件の備考
        commutable_prefecture_ids: 出社できる都道府県
        interested_job_middle_category_ids: 興味のある職種
        interested_industry_ids: 興味のある業界
        skills: プログラミング歴
        icon: アイコン
        # 性格の5軸。画面での呼び名は「働き方の好み」（PR233）
        personality_pace: 働き方の好み（進め方）
        personality_novelty: 働き方の好み（新しさ）
        personality_collaboration: 働き方の好み（周囲との関わり）
        personality_decision: 働き方の好み（決め手）
        personality_atmosphere: 働き方の好み（職場の雰囲気）
      # プログラミング歴の1行。行のエラー（skills[0].years など）の項目名にも使う（StudentProfile.human_attribute_name）
      student_skill:
        technology_id: 技術
        other_name: その他の名前
        years: 年数
        level: レベル
      job_posting:
        status: 募集状態
        title: 募集タイトル
        about: どんな会社か
        business_description: 事業内容
        internship_details: インターンですること
        growth: 成長イメージ
        min_work_days_per_week: 週の稼働日数
        min_work_hours_per_day: 1日の稼働時間
        min_duration_months: 継続期間
        start_month: 開始時期
        work_style: 勤務形態
        work_style_note: 勤務形態の補足
        prefecture_id: 勤務地
        work_location_note: 最寄り駅など
        weekend_ok: 土日OK
        work_note: 稼働条件の備考
        hourly_wage: 時給
        requirements: 必須要件
        preferred_requirements: 歓迎要件
        technology_note: 使用技術の補足
        main_job_middle_category_ids: 主な職種
        related_job_middle_category_ids: 関連する職種
        main_work_process_ids: メインで担当する工程
        involved_work_process_ids: 関われる工程
        technology_ids: 使用技術
        industry_ids: 業界
        business_type_ids: 事業形態
        culture_pace: カルチャー（進め方）
        culture_novelty: カルチャー（新しさ）
        culture_collaboration: カルチャー（周囲との関わり）
        culture_decision: カルチャー（決め手）
        culture_atmosphere: カルチャー（職場の雰囲気）
      # やりとり。reasons は列ではなく、応募のときに送られる理由の一覧（「応募理由を入力してください」などになる）。
      # body も列ではなく、スカウトのときに送られるスカウト文（「スカウト文を入力してください」などになる）
      candidacy:
        reasons: 応募理由
        body: スカウト文
      message:
        body: 本文

  # 選択肢（enum）の日本語の表示名。⑦ GET /api/options がここを読んで返す（API設計.md の 16-1-9）。
  # 画面側には選択肢の表を書かない
  enums:
    company_profile:
      # 人数の範囲は仮置き（未決内容.md の 10-1）
      employee_size:
        size_1_9: 1〜9人
        size_10_49: 10〜49人
        size_50_99: 50〜99人
        size_100_299: 100〜299人
        size_300_999: 300〜999人
        size_1000_plus: 1000人以上
    job_posting:
      status:
        unpublished: 非公開
        published: 掲載中
        closed: 終了
      work_style:
        full_remote: フルリモート
        partial_remote: 一部リモート
        onsite: 出社
    technology:
      category:
        language: 言語
        framework: フレームワーク
        cloud: クラウド
        other: その他
    student_profile:
      grade:
        undergrad_1: 学部1年
        undergrad_2: 学部2年
        undergrad_3: 学部3年
        undergrad_4: 学部4年
        undergrad_5_plus: 学部5年以上
        master_1: 修士1年
        master_2: 修士2年
        doctoral: 博士
        kosen: 高専
        other: その他
      activity_status:
        not_looking: 今は探していない
        skill_up: スキルアップ目的
        job_hunting: 就活目的
    # プログラミング歴のレベル（自己申告。その他決め事.md の 5-3）
    student_skill:
      level:
        v1: v1 学習中
        v2: v2 基礎的な操作が可能
        v3: v3 人に解説・教えることができる
        v4: v4 実務上でメインで用いた経験あり
    # 応募理由・マッチ理由（データベース.md の 8-5 candidacy_reasons）
    candidacy_reason:
      reason:
        business: 事業内容
        industry: 業界
        job_major_category: 職種（大分類）
        job_middle_category: 職種（中分類）
        business_type: 事業形態
        work_process: 工程
        internship_details: インターンですること
        growth: 成長イメージ
        culture: カルチャー
        hourly_wage: 時給
        work_conditions: 稼働条件
        technologies: 使用技術
    # 学生から見た、募集とのやりとりの状態（API設計.md の形E）
    candidacy:
      my_status:
        none: 関係なし
        applied: 応募済み
        scouted: スカウトあり
        matched: マッチ済み
      # 企業から見た、やりとりの状態のタグ（API設計.md の 16-3 ㉑・形D）
      tag:
        pending_application: 未対応応募
        scouted: スカウト済み
        matched: マッチ
        declined: 見送り
        passed: 合格
        failed: 不合格

  # 性格・カルチャーの5軸の名前と、両端の短い名前・説明（その他決め事.md の 5-5）。⑦ GET /api/options の culture_axes で返す。
  # 両端は形容詞ではなく具体的な行動で書き、「良さそうな方」を選びにくくしている
  culture_axes:
    pace:
      name: 進め方
      left_label: スピード
      left_description: まず動くものを作って見せ、直しながら進める
      right_label: 緻密さ
      right_description: 仕様や設計を固めてから作り始める
    novelty:
      name: 新しさ
      left_label: 新しいものを試す
      left_description: 新しいライブラリや手法を積極的に試す
      right_label: 実績あるものを使う
      right_description: 使い慣れた、実績のある技術や手法を選ぶ
    collaboration:
      name: 周囲との関わり
      left_label: 一人でやり切る
      left_description: 自分の担当は、自分で調べて一人でやり切る
      right_label: 相談しながら進める
      right_description: こまめに相談しながら、チームで進める
    decision:
      name: 決め手
      left_label: データ・根拠
      left_description: 数字や根拠がそろってから決める
      right_label: 想い・ビジョン
      right_description: 実現したいことへの想いを優先して決める
    atmosphere:
      name: 職場の雰囲気
      left_label: 交流が多い
      left_description: 雑談や交流の場が多く、にぎやか
      right_label: 集中重視
      right_description: 各自が集中し、やりとりは必要なときだけ

  # rails-i18n の標準の文言を、設計書の文言に合わせる（17-3-6）
  errors:
    messages:
      # 標準は「はすでに存在します」
      taken: はすでに登録されています
      # この API 独自の文言。項目名と組み合わさって「業界に選べない値が含まれています」のような文になる
      # 番号の一覧に、マスタにない番号がある／同じ番号が重複している（権限_バリデーション.md の 17-3-4）
      not_selectable: に選べない値が含まれています
      duplicated: に同じ値が重複しています
      # 募集の関連する職種に、主な職種と同じ中分類がある（その他決め事.md の 5-7）。
      # 「関連する職種に、主な職種と同じものが含まれています」になる
      overlaps_main_job_categories: に、主な職種と同じものが含まれています
      # 募集の関われる工程に、メインで担当する工程と同じものがある（職種と同じ決まり。PR242）。
      # 「関われる工程に、メインで担当する工程と同じものが含まれています」になる
      overlaps_main_work_processes: に、メインで担当する工程と同じものが含まれています
      # アイコンの形式と大きさ（技術構成.md の 9-3）
      invalid_content_type: はPNG・JPEG・WebPのいずれかにしてください
      file_too_large: は2MB以下にしてください
      # 両方同時には入れられない項目の、後ろ側に出す（「大学名は入力しないでください」「その他の名前は入力しないでください」）
      present: は入力しないでください
      # プログラミング歴の年数（権限_バリデーション.md の 17-3-4）。「年数は0.5刻みで入力してください」になる
      half_step: は0.5刻みで入力してください
      # 件数の上限。「プログラミング歴は50件までにしてください」になる
      too_many: は%{count}件までにしてください
      # 学科が、選んだ学部のものでない。「学科は、選んだ学部の中から選んでください」になる
      not_in_selected_faculty: は、選んだ学部の中から選んでください
