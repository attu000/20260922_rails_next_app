# プチ職業体験の講座：テスト設計（design/designs/サービス概要_コンセプト.md の 12章、職業体験_講座見本.md）。
# db/job_trials/loader.rb が、bin/rails db:seed の流れで読み込む。文面を直したら db:seed をもう一度実行する。
# データベースが正で、このファイルは下書き。講座とハードルは code で探して、あれば更新、なければ作る。消したものはデータベースに残る（PR383）
# 文章は Markdown（PR382）。文言は仮（未決内容.md の 10-2）
code: qa-coupon
# 題名は、中身が推測できる名前にする（画面のどこでもこの題名が出る）
title: テスト設計
position: 1
# 中分類は code、工程は名前で指す（番号は環境ごとに変わるため）
job_middle_category_code: "4-1"
work_processes:
  - テスト計画・リスク評価
  - テスト・評価
intro: |
  アプリの新しい機能は、作っただけでは公開できません。仕様どおりに動くかを確かめるのが、テスト担当者です。その仕事の中心は、「どこを、どこまで確かめれば安心して公開できるか」を考えて決めること。これをテスト設計と呼びます。

  この講座では、ネットショップの次のクーポン機能を題材に、4つのハードルを体験します。

  > 注文金額3,000円以上で500円引き。発行から30日間有効。1人1回まで。

  理解する → 洗い出す → 具体化する → 判断する
# ハードルの並びは、ここに書いた順
hurdles:
  - code: understand
    name: 理解する
    overview: |
      テストを始める前に、機能の目的と動きを理解します。仕様書を読み、実際に画面を操作しながら、利用者が何をすると何が起きるのかを確かめます。正しい動きを知らなければ、目の前の動きが正しいかを判断できないからです。「どんなバグがあるか」より先に、「この機能は何をするものか」を押さえます。
    difficulty: |
      仕様書に、すべてがわかりやすく書かれているとは限りません。「3,000円以上の注文で500円引き」とあっても、送料や消費税を含むのかは書かれていないかもしれません。「クーポンを使った注文を取り消したら？」のように、画面を触って初めて浮かぶ疑問もあります。文章を、実際の使われ方に置き換えて想像するのが難しいところです。
    tips: |
      - 仕様を「誰が・どんな条件で・何をすると・どうなるか」に分けて書き出す。書き出せない部分が、あいまいな部分です
      - あいまいな部分は自分で決めず、疑問としてメモし、仕様を決めた人に確かめる
      - 画面を触りながら、仕様書の言葉と画面の動きを1つずつ対応させる
    example: |
      「3,000円以上の注文で500円引き」を読んだら、まず利用場面に置き換えます。3,000円なら500円引き、2,500円なら使えない、4,000円なら使える。

      そのうえで疑問を出します。3,000円は商品の合計か。送料や消費税は含むか。ほかのクーポンで割り引いたあとの金額で判断するのか。
    goal: |
      「誰が、どんな条件で、何をすると、どうなるか」を自分の言葉で説明できる。
    question: |
      > クーポンは発行から30日間使えます。注文金額が3,000円以上なら500円引きです。1人1回だけ使えます。

      このクーポン機能の説明として、最も適切なものを1つ選びなさい。
    choices:
      - key: A
        body: すべてのユーザーが、いつでも3,000円以上の注文をすると、何度でも500円引きになる
        correct: false
        explanation: 「いつでも」「何度でも」ではありません。発行から30日間・1人1回という条件が抜けています
      - key: B
        body: クーポンの発行から30日以内のユーザーが、3,000円以上の注文をすると、1回だけ500円引きになる
        correct: true
        explanation: 正解。期限・金額・回数の3つの条件を、すべて言い表しています
      - key: C
        body: クーポンの発行から30日以内のユーザーが、3,000円未満の注文をすると、1回だけ500円引きになる
        correct: false
        explanation: 3,000円「未満」では割引されません。金額の条件が逆になっています
      - key: D
        body: 3,000円以上の注文をしたユーザーは、発行から30日を過ぎても、何度でも500円引きになる
        correct: false
        explanation: 30日を過ぎると使えません。また、使えるのは1人1回までです

  - code: enumerate
    name: 洗い出す
    overview: |
      どこを確かめるべきかを洗い出し、実際に確かめるものを選びます。普通に使ったときだけでなく、条件がぎりぎりのときや、途中で何かが起きたときの動きも考えます。
    difficulty: |
      逆向きの難しさが2つあります。1つは**見落とし**。不具合は「普通でない場面」に潜みがちです。もう1つは**多すぎること**。金額10通り × 期限5通り × 回数3通りで150通りになり、全部は試せません。広げながら絞るのが難しいところです。
    tips: |
      観点を決めて探します。

      - 境目：条件が切り替わる、すぐ前とちょうど
      - 例外：失敗した、取り消した、途中でやめた
      - 組み合わせ：2つの条件が同時に起きたとき

      選ぶときは、結果が切り替わるところと、壊れたときの影響が大きいところ（お金など）を優先します。結果が同じになるもの（4,000円と5,000円）は1つにまとめます。
    example: |
      「3,000円以上」の境目は、2,999円と3,000円。「30日間」なら30日目と31日目。「30日目の23時59分に注文を始め、日付が変わってから確定したら？」という組み合わせも考えられます。例外なら「決済に失敗した注文は、クーポンを使ったことになるか？」です。
    goal: |
      観点に沿って洗い出し、限られた時間で優先するものを選べる。
    question: |
      「1人1回まで」について、確かめる内容として最も適切な組み合わせを1つ選びなさい。
    choices:
      - key: A
        body: 1回目に使えること、2回目に使えないこと、1回目の注文を取り消したあとにもう一度使えるか
        correct: true
        explanation: 正解。境目（1回目と2回目）と例外（取り消し）の両方を押さえています
      - key: B
        body: 1回目に使えること、10回目に使えないこと
        correct: false
        explanation: 境目から遠く、2回目を確かめれば足ります
      - key: C
        body: 1回目に使えること（2回目以降は同じ仕組みなので確かめなくてよい）
        correct: false
        explanation: 「使えなくなる」側という、いちばん大事なところを確かめていません
      - key: D
        body: ユーザーA・B・C の3人が、それぞれ1回目に使えること
        correct: false
        explanation: 3人とも同じ結果になり、2回目も確かめていません

  - code: specify
    name: 具体化する
    overview: |
      洗い出したことを、誰でも同じように実施できる形（テストケース）にし、必要なテストデータも用意します。別の人が行っても、数か月後にやり直しても、同じ確かめができる必要があります。
    difficulty: |
      1つは、**自分に当たり前のことを書き忘れる**こと。「割引されること」だけでは、何円なら合格か、どのユーザーで試すかがわかりません。もう1つは、**テストデータの準備**。「使用済みのユーザー」や「期限切れのクーポン」をどう用意するかまで考える必要があります。
    tips: |
      - 1件で確かめることは1つ
      - 「事前の条件」「操作」「期待する結果」の3つで書く
      - 期待する結果は、数字や表示で書く（「支払い金額が2,500円と表示される」）
      - 事前の条件は、どう用意するかまで書く
    example: |
      > 目的：同じクーポンを2回目には使えないこと
      >
      > 事前の条件：ユーザーBが、このクーポンを使った注文を1回確定している（確定済みの注文をテスト用データとして入れておく）
      >
      > 操作：ユーザーBで3,000円の商品をカートに入れ、クーポンを選ぶ
      >
      > 期待する結果：「このクーポンは使用済みです」と表示され、支払い金額は3,000円のまま
    goal: |
      「何を、どんな状態で、どう操作して、何が起きれば合格か」が誰にでもわかる。
    question: |
      「期限切れのクーポンは使えないこと」を確かめます。テストデータの用意として、最も適切なものを1つ選びなさい。
    choices:
      - key: A
        body: 実際にクーポンを発行し、31日待ってから確かめる
        correct: false
        explanation: 確かめられますが、1か月待つのは現実的ではありません
      - key: B
        body: 発行日を31日前にしたクーポンを、テスト用データとして用意する
        correct: true
        explanation: 正解。確かめたい状態を、データとして直接作っています
      - key: C
        body: 期限切れはめったに起きないので、テストしない
        correct: false
        explanation: 期限切れは必ず起き、お金が絡むので影響も大きいところです
      - key: D
        body: 開発者に「期限切れの処理は正しく作りましたか」と聞く
        correct: false
        explanation: 作った人の確認は、テストの代わりになりません

  - code: judge
    name: 判断する
    overview: |
      テストを行い、結果を見て2つを判断します。期待と違う結果が**本当に不具合か**。そして、**もうテストを終えてよいか**です。
    difficulty: |
      期待と違う結果の原因は、テストデータや操作の誤り、仕様の読み違いのこともあります。確かめずに報告すると、開発者の時間を無駄にします。また、テストは不具合がないことの証明ではありません。全部合格しても、どこで終えるかは根拠を持って判断する必要があります。
    tips: |
      - 原因の候補を、確かめやすい順に消す（データ → 操作 → 仕様の読み方 → システム）
      - 報告には「同じことを起こす手順」「期待した結果」「実際の結果」「試した環境」をそろえる
      - 終えるときは「確かめたこと」「確かめていないこと」「残る危険」を伝える
    example: |
      3,000円の商品で割引されませんでした。データを見ると、そのユーザーは前のテストでクーポンを使っていました。これは不具合ではなく、データの誤りです。直しても割引されなければ、手順・結果・環境をまとめて報告します。

      最後の報告の例：「全50件合格。重大な未解決の不具合は0件。ただし、大量の同時利用は確かめていません。」
    goal: |
      期待と違う結果が不具合かを見極めて説明でき、確かめたことと残る危険を伝えてテストを終えられる。
    question: |
      3,000円の商品で、クーポンを選んでも割引されませんでした。ユーザーは未使用、期限内、操作も正しいことを確かめました。ただ、カートには別の「200円引きクーポン」も使われていました。

      次にすることとして、最も適切なものを1つ選びなさい。
    choices:
      - key: A
        body: 条件はすべて正しいので、不具合として報告する
        correct: false
        explanation: 仕様どおりの動きかもしれません。ハードル1の「割引後の金額で判断するのか」という疑問が、ここで効いてきます
      - key: B
        body: 200円引きのあとの金額（2,800円）で判定されている可能性があるので、「割引後の金額で判定するのか」を仕様を決めた人に確かめる
        correct: true
        explanation: 正解。原因の候補が「仕様の読み方」に残っていることに気づいています
      - key: C
        body: 操作のどこかが違ったはずなので、最初からやり直す
        correct: false
        explanation: データも操作も確かめたあとなので、やり直しても同じです
      - key: D
        body: 200円引きクーポンを外して割引されれば、合格とする
        correct: false
        explanation: 2つのクーポンを一緒に使う場面を、確かめないまま終えています

# ── 企業向けの説明（PR402・PR407）──
# 学生詳細の自己分析のポップアップで、企業に「この講座と各ハードルで何を見ているか」を伝える文。
# データベースには入れず、Rails がその都度このファイルから読む（app/models/job_trial_guide.rb）。
# 文面はまだ変わりそうなので、ここで持つ。直せば db:seed なしで次に開いたときに反映される。
# hurdles の下は、上のハードルの code で対応させる（すべてのハードルの分を書く）
guide:
  summary: テスト設計では、作られた機能が仕様通りに動くかを確かめます。
  hurdles:
    understand:
      skill: 情報を整理する力
      skill_description: 仕様書や実際の画面から、利用者が何をすると何が起きるのかを理解します。また、仕様の曖昧な部分や不足している情報を見つけます。
      skill_point: 情報を整理し、分からない点を見つける力
    enumerate:
      skill: 問題を予測する力
      skill_description: 通常の使い方だけでなく、条件がぎりぎりの場合や想定外の操作などを考え、不具合が起こりそうな箇所を洗い出します。
      skill_point: さまざまな可能性からリスクを予測する力
    specify:
      skill: 課題を形にする力
      skill_description: 洗い出したリスクについて、何をどのように確認すればよいかを考え、具体的なテストとして設計します。
      skill_point: 抽象的な課題を具体的な手順に落とし込む力
    judge:
      skill: 原因を分析する力
      skill_description: テスト結果が期待と異なった場合、その原因や再現条件を調べ、問題を整理して関係者に報告します。
      skill_point: 結果から原因を考え、分かりやすく伝える力
